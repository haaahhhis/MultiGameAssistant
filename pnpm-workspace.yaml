packages:
  - packages/*
  - apps/*
  # The dsh plugin's manifest and patch as published (scripts/package-plugin.mjs), not a package built here.
  - '!packages/dsh-plugin'

# Allow only the native/runtime install scripts dsh and Electron need.
allowBuilds:
  esbuild: true
  node-pty: true
  koffi: true
  '@deepseek-ai/dsh-subprocess-local': true
  electron: true
  '@google/genai': false
  protobufjs: false
  # electron-builder's Squirrel target; not used (the installer is NSIS).
  electron-winstaller: false
