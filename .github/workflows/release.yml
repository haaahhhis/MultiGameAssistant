# A version tag (v0.7.0, v0.7.0-beta.1) builds the Windows installers, x64 and ARM64, and publishes them
# on that tag's GitHub Release, the tag's message as the notes (a tag with "-" is a pre-release;
# `pnpm release` makes the tag, scripts/release.mjs). Run by hand
# (Actions → Release → Run workflow), it only builds: the installers stay with the run as an artifact.
# The dsh plugin package (dsh-multigameassistant.tgz, no version in the name, so the release's
# latest/download link is always the newest) is also staged on npm under the same name (the npm job):
# it goes live once a maintainer approves it on npmjs.com (Staged Packages), with 2FA.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the installers
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag: without one the version would be 0.0.0-dev (scripts/package-desktop.mjs reads git describe).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The version in package.json's packageManager.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm run setup:electron

      - name: Build and test
        run: |
          pnpm run build
          pnpm run typecheck
          pnpm test

      - name: Version
        id: version
        shell: pwsh
        run: |
          # A tag names it (v0.7.0 → 0.7.0); a run by hand takes it from git describe.
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: x64 installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $extra = if ($env:VERSION) { @('--version', $env:VERSION) } else { @() }
          pnpm package:desktop --skip-build --out dist/x64 @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ARM64 installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $extra = if ($env:VERSION) { @('--version', $env:VERSION) } else { @() }
          pnpm package:desktop --skip-build --arch arm64 --out dist/arm64 @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: dsh plugin package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $extra = if ($env:VERSION) { @('--version', $env:VERSION) } else { @() }
          pnpm package:plugin --skip-build --out dist/plugin @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/x64/*.exe, dist/arm64/*.exe, dist/plugin/*.tgz dist/release/
          # The format sha256sum -c reads: "<hash>  <file>", with \n line ends (it is checked again on Linux).
          $lines = Get-ChildItem dist/release/*.exe, dist/release/*.tgz | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist/release/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content dist/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: dist/release/
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          x64=$(ls *.exe | grep -v -- '-arm64\.exe$')
          arm64=$(ls *-arm64.exe)
          plugin=$(ls *.tgz)
          # What changed: the tag's message (pnpm release drafts it from the feat and fix commits);
          # a lightweight tag has none. A signature at its end is not part of the notes.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          {
            if [[ "$ref" == "tag "* ]]; then
              gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#tag }" --jq .message | sed '/^-----BEGIN .*SIGNATURE-----$/,$d'
              echo
            fi
            echo '## 下载'
            echo
            echo "- Windows x64（大多数电脑）：\`$x64\`"
            echo "- Windows ARM64（骁龙等 ARM 处理器的电脑）：\`$arm64\`"
            echo "- 已经装了 dsh：在 dsh 的「Add plugin」里填 \`dsh-multigameassistant\`（npm 连不上时用插件包 \`$plugin\` 的链接；见 README「已经装了 dsh」）"
          } > notes.md
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          # The installers and the dsh plugin: GitHub shows each file's SHA-256, and the app's updater checks against that.
          gh release create "$TAG" *.exe *.tgz --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "MultiGameAssistant ${TAG#v}" --notes-file notes.md "${flags[@]}"

  npm:
    name: Stage the dsh plugin on npm
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing: npm takes this workflow's OIDC identity instead of a token (set up on
    # npmjs.com → the package → Settings → Trusted publishing: haaahhhis/MultiGameAssistant, release.yml),
    # and records where the package was built (provenance). The version is only staged: nothing is
    # live on npm until a maintainer approves it there.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: release

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Stage
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Trusted publishing and `npm stage` need a recent npm 11.
          npm install -g npm@11
          # Staged from the release's own package (npm stage publish packs a folder): the same files as on GitHub.
          mkdir stage
          tar -xzf release/dsh-multigameassistant.tgz -C stage
          cd stage/package
          [[ "$(node -p "require('./package.json').version")" == "${TAG#v}" ]] || { echo "package.json is not ${TAG#v}"; exit 1; }
          # A pre-release (v2.1.0-rc.1) goes out as "next", so `dsh plugin add dsh-multigameassistant` keeps the stable one.
          dist=latest
          if [[ "$TAG" == *-* ]]; then dist=next; fi
          npm stage publish --access public --tag "$dist"
          {
            echo "## npm"
            echo
            echo "dsh-multigameassistant@${TAG#v} is staged as \`$dist\`. It goes live once approved on"
            echo "npmjs.com → the package → Staged Packages (Approve, with 2FA), or \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
