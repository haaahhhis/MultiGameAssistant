# dsh-multigameassistant: the app's plugins (packages/bundle/cordis.patch.yml, each @adg/<plugin> as dsh-multigameassistant/<plugin>)
# sharing the dsh with the person's other chats, and the app's agent preset (dsh's standard one with the app's
# tools and prompts, and compaction as 设置 → 对话压缩 says). No row of dsh is restated.
# Made by scripts/package-plugin.mjs (--sync) from packages/bundle/cordis.patch.yml: change that one.
- insert:
    - id: adg-gateway
      name: 'dsh-multigameassistant/gateway'
      config:
        # Only its own sessions are its concern; the UI is under dsh's web server, at /adg/.
        shared: true
        listen: false
        port: !!js "Number(process.env.ADG_GATEWAY_PORT ?? 3290)"
        token: !!js "process.env.ADG_GATEWAY_TOKEN || undefined"
        staticDir: !!js "process.env.ADG_UI_DIR || undefined"
        workspaceDir: !!js "process.env.ADG_WORKSPACE_DIR || dshHomePath('adg/workspace')"
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        # skill_save keeps saved skills in this app's data, for its own agents only.
        skillsDir: !!js "(process.env.ADG_DATA_DIR || dshHomePath('adg/data')) + '/skills'"
        validateResults: true

    # M1: script library — packs, GitHub installs, local imports, versions,
    # environment checks; `script_*` agent tools and the `scripts` capability.
    - id: adg-script-registry
      name: 'dsh-multigameassistant/script-registry'
      config:
        toolsDir: !!js "process.env.ADG_TOOLS_DIR || dshHomePath('adg/tools')"
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        defaults:
          downloadMirror: !!js "process.env.ADG_GITHUB_MIRROR || ''"

    # M2: running pack tasks (config patches restored afterwards, log rules,
    # resource locks); `script_run` and friends, the `runs` capability.
    - id: adg-runner
      name: 'dsh-multigameassistant/runner'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M2: emulators for ADB tasks (MuMu via MuMuManager.exe, or a manual ADB
    # address); the `emulator` requirement check; the `emulators` capability.
    - id: adg-emulator
      name: 'dsh-multigameassistant/emulator'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        sharedDir: !!js "(process.env.ADG_TOOLS_DIR || dshHomePath('adg/tools')) + '/_shared'"

    # M2: script analysis, pack drafts for the user to accept, and every pack's
    # SKILL.md as an agent skill; the `packs` capability.
    - id: adg-analyzer
      name: 'dsh-multigameassistant/analyzer'

    # M2: the agent may not change script files without the user's grant.
    - id: adg-guard
      name: 'dsh-multigameassistant/guard'

    # M3: incidents while scripts run (error rules, failures, stalls,
    # overtime), L0 recovery from the pack, screenshots; the `monitor` capability.
    - id: adg-monitor
      name: 'dsh-multigameassistant/monitor'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M5: screen tools for any image-capable model (emulator over ADB, the
    # Windows desktop and windows) and interventions: what L0 cannot settle,
    # the agent handles with the script paused; the `intervene` capability.
    - id: adg-intervene
      name: 'dsh-multigameassistant/intervene'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M3: the chat layer — notices with buttons, replies, conversations with
    # the agent, approval cards; the `notify` capability.
    - id: adg-notify
      name: 'dsh-multigameassistant/notify'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M3: the Feishu channel (long connection; App Secret in dsh credentials
    # as ADG_FEISHU_APP_SECRET); the `feishu` capability.
    #   ADG_FEISHU_BASE_URL   API base instead of open.feishu.cn (tests)
    - id: adg-feishu
      name: 'dsh-multigameassistant/feishu'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        baseUrl: !!js "process.env.ADG_FEISHU_BASE_URL || undefined"

    # The QQ official bot channel (WebSocket gateway; AppSecret in dsh
    # credentials as ADG_QQBOT_APP_SECRET); the `qqbot` capability.
    #   ADG_QQBOT_BASE_URL    API base instead of api.bot.qq.com (tests)
    - id: adg-qqbot
      name: 'dsh-multigameassistant/qqbot'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        baseUrl: !!js "process.env.ADG_QQBOT_BASE_URL || undefined"

    # M4: pipelines — DAGs of script tasks and other steps, resource-aware
    # queueing, failure policies, the feasibility check; the `pipelines` capability.
    - id: adg-orchestrator
      name: 'dsh-multigameassistant/orchestrator'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M4: timetables, chained pipelines, starting at logon; M7: keeping awake,
    # sleep / shutdown after a pipeline, timed wake; the `schedule` capability.
    #   ADG_LAUNCH_COMMAND   JSON array that starts the desktop app (set by it)
    #   ADG_AUTOSTARTED      1 when the desktop app was started at logon
    #   ADG_APP_START        1 on the desktop app's first dsh start (0 after a crash restart)
    #   ADG_POWER_DRY_RUN    1: count down and notify, but do not sleep or shut down (trying it out)
    - id: adg-scheduler
      name: 'dsh-multigameassistant/scheduler'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        launchCommand: !!js "process.env.ADG_LAUNCH_COMMAND || undefined"
        autostarted: !!js "process.env.ADG_AUTOSTARTED === '1'"
        appStart: !!js "process.env.ADG_APP_START === '1'"
        powerDryRun: !!js "process.env.ADG_POWER_DRY_RUN === '1'"

    # M6: game information — Game Packs, the event calendar (data sites read
    # without a model, the agent reading the game screen), the daily report;
    # the `games` capability.
    - id: adg-game-intel
      name: 'dsh-multigameassistant/game-intel'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # The package itself: dsh's page loads its sidebar entry (「多游戏助手」) from it.
    - id: adg-sidebar
      name: 'dsh-multigameassistant'

    # The app's agent preset: its sessions run this one (the gateway creates them so).
    - id: preset-mga
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mga
        name: 多游戏助手
        description: MultiGameAssistant：安装、运行和编排游戏脚本，处理运行中的问题，查活动
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # 设置 → 对话压缩 (compaction.json in the app's data); read when the agent service starts.
                  auto: !!js "(() => { try { return JSON.parse(process.getBuiltinModule('node:fs').readFileSync((process.env.ADG_DATA_DIR || dshHomePath('adg/data')) + '/compaction.json', 'utf8')) } catch { return {} } })().auto !== false"
                  thresholdRatio: !!js "Math.min(95, Math.max(50, Number((() => { try { return JSON.parse(process.getBuiltinModule('node:fs').readFileSync((process.env.ADG_DATA_DIR || dshHomePath('adg/data')) + '/compaction.json', 'utf8')) } catch { return {} } })().threshold) || 80)) / 100"
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          - id: adg-agent
            name: 'dsh-multigameassistant/agent'
