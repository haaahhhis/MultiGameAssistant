# @adg/bundle — the profile layer above dsh-base and dsh-web-app.
#
# It mounts the MultiGameAssistant gateway next to the upstream host services it
# calls (sessionController, approval). Upstream rows are never edited here;
# anything unwanted is disabled by id, so a later reorder upstream cannot
# resurrect it. Feature plugins (installer, runner, orchestrator, …) are added
# below as they land, one row each, so any of them can be switched off with
# `disabled: true`.
#
# Environment knobs (all optional):
#   ADG_GATEWAY_PORT    listen port (default 3290; 0 = any free port)
#   ADG_GATEWAY_TOKEN   fixed connection token (default: random per start)
#   ADG_UI_DIR          built UI directory served at /
#   ADG_TOOLS_DIR       where scripts are installed (default <dsh home>/adg/tools)
#   ADG_DATA_DIR        script library state and user packs (default <dsh home>/adg/data)
#   ADG_GITHUB_MIRROR   initial download mirror prefix, e.g. https://ghfast.top/ (changeable in the UI)

- insert:
    - id: adg-gateway
      name: '@adg/gateway'
      config:
        port: !!js "Number(process.env.ADG_GATEWAY_PORT ?? 3290)"
        token: !!js "process.env.ADG_GATEWAY_TOKEN || undefined"
        staticDir: !!js "process.env.ADG_UI_DIR || undefined"
        workspaceDir: !!js "process.env.ADG_WORKSPACE_DIR || dshHomePath('adg/workspace')"
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        # skill_save keeps saved skills in this app's data, for its own agents only.
        skillsDir: !!js "(process.env.ADG_DATA_DIR || dshHomePath('adg/data')) + '/skills'"
        validateResults: true

    # M1: script library — packs, GitHub installs, local imports, versions,
    # environment checks; `script_*` agent tools and the `scripts` capability.
    - id: adg-script-registry
      name: '@adg/script-registry'
      config:
        toolsDir: !!js "process.env.ADG_TOOLS_DIR || dshHomePath('adg/tools')"
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        defaults:
          downloadMirror: !!js "process.env.ADG_GITHUB_MIRROR || ''"

    # M2: running pack tasks (config patches restored afterwards, log rules,
    # resource locks); `script_run` and friends, the `runs` capability.
    - id: adg-runner
      name: '@adg/runner'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M2: emulators for ADB tasks (MuMu via MuMuManager.exe, or a manual ADB
    # address); the `emulator` requirement check; the `emulators` capability.
    - id: adg-emulator
      name: '@adg/emulator'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        sharedDir: !!js "(process.env.ADG_TOOLS_DIR || dshHomePath('adg/tools')) + '/_shared'"

    # M2: script analysis, pack drafts for the user to accept, and every pack's
    # SKILL.md as an agent skill; the `packs` capability.
    - id: adg-analyzer
      name: '@adg/analyzer'

    # M2: the agent may not change script files without the user's grant.
    - id: adg-guard
      name: '@adg/guard'

    # M3: incidents while scripts run (error rules, failures, stalls,
    # overtime), L0 recovery from the pack, screenshots; the `monitor` capability.
    - id: adg-monitor
      name: '@adg/monitor'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M5: screen tools for any image-capable model (emulator over ADB, the
    # Windows desktop and windows) and interventions: what L0 cannot settle,
    # the agent handles with the script paused; the `intervene` capability.
    - id: adg-intervene
      name: '@adg/intervene'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M3: the chat layer — notices with buttons, replies, conversations with
    # the agent, approval cards; the `notify` capability.
    - id: adg-notify
      name: '@adg/notify'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M3: the Feishu channel (long connection; App Secret in dsh credentials
    # as ADG_FEISHU_APP_SECRET); the `feishu` capability.
    #   ADG_FEISHU_BASE_URL   API base instead of open.feishu.cn (tests)
    - id: adg-feishu
      name: '@adg/feishu'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        baseUrl: !!js "process.env.ADG_FEISHU_BASE_URL || undefined"

    # M4: pipelines — DAGs of script tasks and other steps, resource-aware
    # queueing, failure policies, the feasibility check; the `pipelines` capability.
    - id: adg-orchestrator
      name: '@adg/orchestrator'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

    # M4: timetables, chained pipelines, starting at logon; M7: keeping awake,
    # sleep / shutdown after a pipeline, timed wake; the `schedule` capability.
    #   ADG_LAUNCH_COMMAND   JSON array that starts the desktop app (set by it)
    #   ADG_AUTOSTARTED      1 when the desktop app was started at logon
    #   ADG_APP_START        1 on the desktop app's first dsh start (0 after a crash restart)
    #   ADG_POWER_DRY_RUN    1: count down and notify, but do not sleep or shut down (trying it out)
    - id: adg-scheduler
      name: '@adg/scheduler'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"
        launchCommand: !!js "process.env.ADG_LAUNCH_COMMAND || undefined"
        autostarted: !!js "process.env.ADG_AUTOSTARTED === '1'"
        appStart: !!js "process.env.ADG_APP_START === '1'"
        powerDryRun: !!js "process.env.ADG_POWER_DRY_RUN === '1'"

    # M6: game information — Game Packs, the event calendar (data sites read
    # without a model, the agent reading the game screen), the daily report;
    # the `games` capability.
    - id: adg-game-intel
      name: '@adg/game-intel'
      config:
        dataDir: !!js "process.env.ADG_DATA_DIR || dshHomePath('adg/data')"

# M4 of the plan trims the official browser client here (ui-*, client-* rows).
# Until then the official Web UI stays up for side-by-side comparison.

# The agent's sandboxed PowerShell (dsh-base's `pwsh-sandbox`). Its executor
# prefers PowerShell 7 (pwsh.exe) when installed; under the sandbox's
# restricted Low-integrity token PowerShell 7 can die before running anything
# (exit 0xC0000142, "DLL initialization failed"), so every confined command
# failed. Windows PowerShell 5.1 ships with Windows and works there.
# Unconfined commands (approved `danger-full-access`) still use the default.
#   ADG_SANDBOX_PWSH   another PowerShell for confined commands
- id: pwsh-sandbox
  config:
    pwshPath: !!js "process.env.ADG_SANDBOX_PWSH || `${process.env.SystemRoot ?? 'C:/Windows'}/System32/WindowsPowerShell/v1.0/powershell.exe`"

# Permission presets (dsh-base's `permission` row, restated whole: an id row
# replaces the config). `full-access` is what 设置 → 权限 → 完全访问 puts on
# every session: no sandbox, and approvals still asked — dsh's `never` policy
# rejects them, which would fail the app's own tools — but the gateway
# answers every one with "allow" at once.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      full-access:
        sandbox: danger-full-access
        approval: ask
        name: 完全访问
        description: 不用沙箱，所有需要确认的操作都自动允许（设置 → 权限）

# The agent's working folder for sessions that do not name one: a folder of
# its own, never the app's. dsh's Windows sandbox gives the working folder a
# permanent low-integrity label, and a program started from under such a
# folder (the desktop app's Electron, when the app lives there) runs at low
# integrity and fails to start. scripts/profile.mjs creates the folder.
#   ADG_WORKSPACE_DIR   another folder
- id: working-directory
  config:
    defaultDirectory: !!js "process.env.ADG_WORKSPACE_DIR || dshHomePath('adg/workspace')"
