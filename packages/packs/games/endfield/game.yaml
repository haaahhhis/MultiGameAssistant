# 明日方舟：终末地 (Arknights: Endfield, CN server). Event dates, the version
# and each event's kind and description come from the StarRailAssistant
# public API (no model needed); for anything it lacks the agent reads the
# official news (web_fetch / web_search), and the game screen (GAME.md).
id: endfield
name: 明日方舟：终末地
aliases: [终末地, Endfield]
scripts: [maaend]
timezone: Asia/Shanghai
dailyReset: '04:00'
screen:
  target: window
sources:
  # The only source the plugin reads by itself.
  - id: sra
    name: SRA 公共 API
    homepage: https://starrailassistant.top/reference/public-api/
    sra:
      game: end
  - id: official
    name: 官网新闻
    homepage: https://endfield.hypergryph.com/news
  - id: biligame
    name: 终末地 WIKI（哔哩哔哩）
    homepage: https://wiki.biligame.com/zmd/活动一览
